<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Pokémon Info</title>  
    <link rel="stylesheet" href="styles.css"> <!-- Link to external CSS for better organization -->  
</head>  
<body>  
    <div class="container">  
        <h1 id="pokemonName" class="pokemon-name"></h1>  
        <div class="pokemon">  
            <img id="pokemonImage" src="" alt="Pokémon Image">  
            <div class="pokemon-stats">  
                <p>Height: <span id="pokemonHeight"></span> m</p>  
                <p>Weight: <span id="pokemonWeight"></span> kg</p>  
                <p>Base Experience: <span id="pokemonBaseExp"></span></p>  
                <p>Pokédex ID: <span id="pokemonId"></span></p>  
            </div>  
        </div>  
        <div class="details">  
            <h3>Abilities:</h3>  
            <p id="pokemonAbilities"></p>  
            <h3>Moves:</h3>  
            <div id="pokemonMoves"></div>  
            <h3>Types:</h3>  
            <p id="pokemonTypes"></p>  
            <h3>Species:</h3>  
            <p id="pokemonSpecies"></p>  
        </div>  
    </div>  
    <script src="pokemon.js"></script>  
</body>  
</html>
